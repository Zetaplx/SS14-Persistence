- type: entity
  id: GasTankBaseNew
  parent: BaseItem
  abstract: true
  components:
  - type: InteractionOutline
  - type: Appearance
  - type: Sprite
  - type: Item
    size: Normal
  - type: Clothing
    quickEquip: false
  - type: UseDelay
    delays:
      gasTank:
        length: 1.0
  - type: ActivatableUI
    key: enum.SharedGasTankUiKey.Key
  - type: UserInterface
    interfaces: 
      enum.SharedGasTankUiKey.Key:
        type: GasTankBoundUserInterface
  - type: GasTank
    outputPressure: 21.3
    air:
      volume: 5
      temperature: 293.15
    tankLowPressure: 30.0
  - type: Explosive
    explosionType: MicroBomb
    maxIntensity: 20
  - type: MeleeWeapon
    wideAnimationRotation: 45
    attackRate: 0.8
    damage:
      types:
        Blunt: 10
  - type: PhysicalComposition
    materialComposition: 
      Steel: 185
  - type: StaticPrice
    price: 30

