- type: entity
  parent: BaseComputer
  id: TechDiskTerminal
  name: Technology Disk Terminal
  components:
  - type: Sprite
    noRot: true
    sprite: Structures/Machines/tech_disk_printer.rsi
    layers:
    - map: ["computerLayerBody"]
      state: icon
    - map: ["computerLayerScreen"]
      state: unshaded
  - type: PointLight
    radius: 0.8
    energy: 0.5
    color: "#b53ca1"
  - type: UserInterface
    interfaces:
      enum.TechDiskTerminalUIKey.Main:
        type: TechDiskTerminalBoundUserInterface
  - type: ActivatableUI
    key: enum.TechDiskTerminalUIKey.Main
  #- type: ActivatableUIRequiresAccess
  #- type: ActivatableUIRequiresPower
  - type: ExtensionCableReceiver
  #- type: AccessReader
  - type: ResearchClient
  - type: ContainerContainer
    containers:
      disk: !type:ContainerSlot
  - type: ItemSlots
    slots:
      disk:
        whitelist:
          components:
          - TechnologyDisk
  - type: TechDiskTerminal
    printDuration: 5s

